{% extends "base.html" %}

{% block title %}Register - IT Asset Management Platform{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 480px;">
    <div class="auth-header">
      <div class="auth-logo-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h1 class="auth-title">Register Account</h1>
      <p class="auth-subtitle">Create an organization employee profile</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="full_name">Full Name <span class="required">*</span></label>
        <div class="search-box" style="min-width: 100%;">
          <i class="bi bi-person"></i>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="John Doe" value="{{ full_name or '' }}" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work Email <span class="required">*</span></label>
        <div class="search-box" style="min-width: 100%;">
          <i class="bi bi-envelope"></i>
          <input type="email" id="email" name="email" class="form-control" placeholder="john.doe@organization.com" value="{{ email or '' }}" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username <span class="required">*</span></label>
        <div class="search-box" style="min-width: 100%;">
          <i class="bi bi-at"></i>
          <input type="text" id="username" name="username" class="form-control" placeholder="johndoe" value="{{ username or '' }}" required>
        </div>
        <div class="form-hint">3-50 letters, numbers, hyphens or underscores</div>
      </div>

      <div class="form-row">
        <div class="col-6">
          <div class="form-group">
            <label class="form-label" for="password">Password <span class="required">*</span></label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm <span class="required">*</span></label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
          </div>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-weight: 600;">
          <i class="bi bi-check-circle"></i> Create Account
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
